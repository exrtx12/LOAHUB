<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LOAHUB — 흩어진 로스트아크 도구를 한 곳에</title>
<meta name="description" content="캐릭터명 한 번만 입력하면 로스트아크 주요 사이트 전부에서 조회합니다.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
/* ===================================================================
   색상 / 폰트 설정. 여기 값만 바꿔도 사이트 분위기가 전부 바뀝니다.
   =================================================================== */
:root{
  --ink:        #14121b;   /* 배경 */
  --panel:      #1c1926;   /* 카드 배경 */
  --panel-hi:   #242031;   /* 카드 마우스 올렸을 때 */
  --line:       #302c40;   /* 얇은 경계선 */
  --gold:       #d8b45c;   /* 강조색 (금색) */
  --gold-dim:   #8d7538;
  --arc:        #7be0d0;   /* 포커스 링 (아크 빛) */
  --text:       #ede9f5;
  --muted:      #8b849e;

  /* Noto Sans KR — SIL Open Font License 1.1, 상업적 이용 포함 자유롭게 사용 가능 */
  --body: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
  --mono: 'JetBrains Mono', monospace;
}

*{ box-sizing:border-box; margin:0; padding:0; }

body{
  background:var(--ink);
  color:var(--text);
  font-family:var(--body);
  font-weight:400;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}

body::before{
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:radial-gradient(900px 500px at 50% -15%, rgba(216,180,92,.10), transparent 70%);
}

.wrap{ position:relative; z-index:1; max-width:1080px; margin:0 auto; padding:0 24px; }

/* ---------- 상단 헤더 ---------- */
.masthead{ padding:64px 0 0; }

.wordmark{
  font-weight:900;
  font-size:clamp(34px, 6.5vw, 54px);
  line-height:1; letter-spacing:.01em;
}
.wordmark em{ font-style:normal; color:var(--gold); }

.tagline{
  margin-top:14px; max-width:44ch;
  color:var(--muted); font-size:15px;
}

/* ---------- 캐릭터 검색 (이 사이트의 주 기능) ---------- */
.charsearch{ margin-top:32px; }

.charsearch .row{ display:flex; gap:8px; }

.charsearch input{
  flex:1; min-width:0;
  padding:16px 18px;
  background:var(--panel); color:var(--text);
  border:1px solid var(--line); border-radius:10px;
  font-family:var(--body); font-size:16px; font-weight:500;
}
.charsearch input::placeholder{ color:var(--muted); font-weight:400; }
.charsearch input:focus{ outline:none; border-color:var(--gold); }

.charsearch button{
  padding:0 26px;
  background:var(--gold); color:#14121b;
  border:none; border-radius:10px;
  font-family:var(--body); font-size:15px; font-weight:700;
  cursor:pointer; white-space:nowrap;
  transition:filter .15s;
}
.charsearch button:hover{ filter:brightness(1.08); }
.charsearch button:focus-visible{ outline:2px solid var(--arc); outline-offset:3px; }

.charhint{ margin-top:10px; font-size:12.5px; color:var(--muted); }

/* 검색 결과 패널 */
.charresult{ margin-top:18px; }
.charresult:empty{ display:none; }

.charresult .who{
  display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;
  margin-bottom:12px; font-size:13px; color:var(--muted);
}
.charresult .who b{ color:var(--gold); font-size:16px; font-weight:700; }

.charlinks{ display:grid; grid-template-columns:repeat(auto-fit, minmax(180px,1fr)); gap:10px; }

.charlink{
  display:block; padding:15px 16px;
  background:var(--panel); border:1px solid var(--gold-dim); border-radius:10px;
  color:inherit; text-decoration:none;
  transition:background .16s, border-color .16s, transform .16s;
}
.charlink:hover{ background:var(--panel-hi); border-color:var(--gold); transform:translateY(-2px); }
.charlink:focus-visible{ outline:2px solid var(--arc); outline-offset:3px; }
.charlink .s{ font-size:15px; font-weight:700; color:var(--gold); }
.charlink .d{ margin-top:4px; font-size:12.5px; color:var(--muted); line-height:1.5; }

/* ---------- 도구 목록 영역 ---------- */
.toolszone{ margin-top:56px; padding-top:32px; border-top:1px solid var(--line); }

.zonehead{ font-size:13px; font-weight:700; letter-spacing:.08em; color:var(--muted); }

.filterbar{ margin-top:14px; }
.filterbar input{
  width:100%; padding:12px 15px;
  background:var(--panel); color:var(--text);
  border:1px solid var(--line); border-radius:9px;
  font-family:var(--body); font-size:14px;
}
.filterbar input::placeholder{ color:var(--muted); }
.filterbar input:focus{ outline:none; border-color:var(--gold-dim); }

.sources{ margin-top:12px; display:flex; flex-wrap:wrap; gap:8px; }
.src{
  display:inline-flex; align-items:baseline; gap:8px;
  padding:6px 13px;
  background:transparent; color:var(--muted);
  border:1px solid var(--line); border-radius:999px;
  font-family:var(--body); font-size:13px; cursor:pointer;
  transition:border-color .15s, color .15s, background .15s;
}
.src .n{ font-family:var(--mono); font-size:11px; color:var(--gold-dim); }
.src:hover{ color:var(--text); border-color:var(--gold-dim); }
.src[aria-pressed="true"]{
  background:var(--gold); color:#14121b; border-color:var(--gold); font-weight:700;
}
.src[aria-pressed="true"] .n{ color:rgba(20,18,27,.6); }

/* ---------- 기능 카드 ---------- */
.group{ padding:34px 0 4px; }

.group-head{ display:flex; align-items:baseline; gap:12px; margin-bottom:16px; }
.group-head h2{ font-size:18px; font-weight:700; letter-spacing:-.01em; }
.group-head .rule{ flex:1; height:1px; background:var(--line); }
.group-head .count{ font-family:var(--mono); font-size:11px; color:var(--muted); }

.grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(248px,1fr)); gap:12px; }

.card{
  display:block; position:relative;
  padding:18px 18px 16px;
  background:var(--panel); border:1px solid var(--line); border-radius:12px;
  color:inherit; text-decoration:none;
  transition:background .16s, border-color .16s, transform .16s;
}
.card::before{
  content:''; position:absolute; left:0; top:16px; bottom:16px; width:2px;
  background:var(--gold); border-radius:2px;
  opacity:0; transition:opacity .16s;
}
.card:hover{ background:var(--panel-hi); border-color:var(--gold-dim); transform:translateY(-2px); }
.card:hover::before{ opacity:1; }
.card:focus-visible{ outline:2px solid var(--arc); outline-offset:3px; }

.card .title{ font-size:15px; font-weight:700; letter-spacing:-.01em; }
.card .desc{ margin-top:6px; font-size:13px; color:var(--muted); line-height:1.55; }
.card .from{
  margin-top:13px; padding-top:11px; border-top:1px solid var(--line);
  display:flex; align-items:center; justify-content:space-between; gap:10px;
}
.card .site{ font-size:12.5px; color:var(--gold); font-weight:500; }
.card .domain{ font-family:var(--mono); font-size:10.5px; color:var(--muted); }

/* ---------- 결과 없음 / 푸터 ---------- */
.empty{ padding:56px 0; text-align:center; color:var(--muted); font-size:14px; }
.empty b{ color:var(--text); font-weight:700; }

footer{
  margin-top:64px; padding:28px 0 60px;
  border-top:1px solid var(--line);
  color:var(--muted); font-size:12.5px; line-height:1.75;
}

@media (max-width:640px){
  .masthead{ padding:44px 0 0; }
  .charsearch .row{ flex-direction:column; }
  .charsearch button{ padding:14px 26px; }
  .grid{ grid-template-columns:1fr; }
}
@media (prefers-reduced-motion:reduce){
  *{ transition:none !important; }
}
</style>
</head>

<body>
<div class="wrap">

  <header class="masthead">
    <h1 class="wordmark">LOA<em>HUB</em></h1>
    <p class="tagline">캐릭터명 한 번만 입력하면 주요 사이트 전부에서 조회합니다. 어느 사이트에 뭐가 있는지 외울 필요 없습니다.</p>

    <div class="charsearch">
      <div class="row">
        <input type="text" id="charInput" placeholder="캐릭터명을 입력하세요" autocomplete="off" spellcheck="false">
        <button id="charBtn">검색</button>
      </div>
      <p class="charhint">Enter 키로도 검색됩니다. 링크는 새 탭에서 열립니다.</p>
      <div class="charresult" id="charResult"></div>
    </div>
  </header>

  <section class="toolszone">
    <h2 class="zonehead">도구 찾기</h2>
    <div class="filterbar">
      <input type="search" id="filterInput" placeholder="기능으로 검색  ·  예: 시세, 재련, 모험 섬" autocomplete="off">
    </div>
    <div class="sources" id="sources"></div>
    <div id="results"></div>
  </section>

  <footer>
    LOAHUB는 개인이 만든 링크 모음집입니다. 각 기능은 원 사이트로 연결되며, LOAHUB는 해당 사이트들과 아무 관계가 없습니다.<br>
    로스트아크의 저작권은 Smilegate RPG에 있습니다. 본문 글꼴은 Noto Sans KR (SIL Open Font License 1.1)을 사용합니다.
  </footer>

</div>

<script>

  { 사이트:"로펙",   설명:"환산 점수 · 티어 확인",   주소:"https://lopec.kr/character/specPoint/{닉네임}" },
  { 사이트:"로아와", 설명:"원정대 · 정보 카드",     주소:"https://loawa.com/char/{닉네임}" },

  { 기능:"전투력 · 아이템 레벨 랭킹", 설명:"서버별 상위 캐릭터 순위",             사이트:"클로아", 주소:"https://kloa.gg/",   분류:"캐릭터 · 랭킹" },

  { 기능:"환산 랭킹 · 티어컷",   설명:"에스더 / 그랜드마스터 등 구간 확인",       사이트:"로펙",   주소:"https://lopec.kr/",  분류:"캐릭터 · 랭킹" },

  /* ---------- 2. 일정 · 컨텐츠 ---------- */
  { 기능:"모험 섬",              설명:"오늘의 모험 섬과 보상",                    사이트:"로아와", 주소:"https://loawa.com/", 분류:"일정 · 컨텐츠" },
  { 기능:"주간 일정표",          설명:"이번 주 컨텐츠 캘린더",                    사이트:"로아와", 주소:"https://loawa.com/", 분류:"일정 · 컨텐츠" },

  { 기능:"각인서 시세 차트",     설명:"기간별 가격 흐름을 그래프로",              사이트:"클로아", 주소:"https://kloa.gg/",   분류:"시세 · 골드" },
  { 기능:"보조 재료 실제 가치",  설명:"특수 재료 효율을 한눈에 비교",             사이트:"로아또", 주소:"https://loatto.kr/",  분류:"시세 · 골드" },

/* 분류가 화면에 나오는 순서 */
const 분류순서 = [
  "캐릭터 · 랭킹",
  "일정 · 컨텐츠",
  "시뮬레이터 · 확률",
  "시세 · 골드",
  "생활 · 제작",
];


/* ===================================================================
   아래는 화면을 그리는 코드입니다. 당장은 건드리지 않아도 됩니다.
   =================================================================== */

const $charInput  = document.getElementById('charInput');
const $charBtn    = document.getElementById('charBtn');
const $charResult = document.getElementById('charResult');
const $filter     = document.getElementById('filterInput');
const $sources    = document.getElementById('sources');
const $results    = document.getElementById('results');

let 선택된사이트 = null;
let 검색어 = '';

// HTML에 그대로 넣어도 안전하게 문자 변환
function 안전하게(글자){
  return String(글자).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

// 주소에서 도메인만 뽑아내기 (예: https://kloa.gg/ → kloa.gg)
function 도메인(주소){
  return 주소.replace(/^https?:\/\//, '').replace(/[/?].*$/, '');
}


/* ---------- 캐릭터 검색 ---------- */

function 캐릭터검색(){
  const 닉네임 = $charInput.value.trim();

  if (!닉네임){
    $charResult.innerHTML = '';
    $charInput.focus();
    return;
  }

  // 한글이나 특수문자가 주소에 안전하게 들어가도록 변환
  const 변환된닉네임 = encodeURIComponent(닉네임);

  const 링크들 = 캐릭터검색사이트.map(s => {
    const 완성주소 = s.주소.replace('{닉네임}', 변환된닉네임);
    return `
      <a class="charlink" href="${안전하게(완성주소)}" target="_blank" rel="noopener noreferrer">
        <div class="s">${안전하게(s.사이트)}</div>
        <div class="d">${안전하게(s.설명)}</div>
      </a>`;
  }).join('');

  $charResult.innerHTML = `
    <div class="who"><b>${안전하게(닉네임)}</b><span>${캐릭터검색사이트.length}개 사이트에서 조회</span></div>
    <div class="charlinks">${링크들}</div>`;
}

$charBtn.addEventListener('click', 캐릭터검색);

$charInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') 캐릭터검색();
});

// 입력을 다 지우면 결과 패널도 같이 치우기
$charInput.addEventListener('input', () => {
  if (!$charInput.value.trim()) $charResult.innerHTML = '';
});


/* ---------- 도구 목록 ---------- */

function 사이트버튼그리기(){
  const 개수 = {};
  기능목록.forEach(t => { 개수[t.사이트] = (개수[t.사이트] || 0) + 1; });

  $sources.innerHTML = Object.entries(개수)
    .sort((a,b) => b[1] - a[1])
    .map(([이름, n]) => `
      <button class="src" data-site="${안전하게(이름)}" aria-pressed="${선택된사이트 === 이름}">
        ${안전하게(이름)} <span class="n">${n}</span>
      </button>`)
    .join('');

  $sources.querySelectorAll('.src').forEach(버튼 => {
    버튼.onclick = () => {
      const 이름 = 버튼.dataset.site;
      선택된사이트 = (선택된사이트 === 이름) ? null : 이름;   // 한 번 더 누르면 해제
      사이트버튼그리기();
      목록그리기();
    };
  });
}

function 걸러내기(){
  const q = 검색어.trim().toLowerCase();
  return 기능목록.filter(t => {
    if (선택된사이트 && t.사이트 !== 선택된사이트) return false;
    if (!q) return true;
    return (t.기능 + t.설명 + t.사이트 + t.분류).toLowerCase().includes(q);
  });
}

function 목록그리기(){
  const 보여줄것 = 걸러내기();

  if (보여줄것.length === 0){
    $results.innerHTML = `<p class="empty">찾는 기능이 없습니다.<br>다른 단어로 검색하거나, <b>기능목록</b>에 직접 추가해 보세요.</p>`;
    return;
  }

  const 모든분류 = [...분류순서, ...new Set(보여줄것.map(t => t.분류))]
    .filter((v,i,a) => a.indexOf(v) === i);

  $results.innerHTML = 모든분류.map(분류 => {
    const 항목들 = 보여줄것.filter(t => t.분류 === 분류);
    if (항목들.length === 0) return '';

    const 카드들 = 항목들.map(t => `
      <a class="card" href="${안전하게(t.주소)}" target="_blank" rel="noopener noreferrer">
        <div class="title">${안전하게(t.기능)}</div>
        <div class="desc">${안전하게(t.설명)}</div>
        <div class="from">
          <span class="site">${안전하게(t.사이트)}</span>
          <span class="domain">${안전하게(도메인(t.주소))}</span>
        </div>
      </a>`).join('');

    return `
      <section class="group">
        <div class="group-head">
          <h2>${안전하게(분류)}</h2>
          <span class="rule"></span>
          <span class="count">${항목들.length}</span>
        </div>
        <div class="grid">${카드들}</div>
      </section>`;
  }).join('');
}

$filter.addEventListener('input', e => {
  검색어 = e.target.value;
  목록그리기();
});

// 키보드에서 / 를 누르면 캐릭터 검색창으로 이동
document.addEventListener('keydown', e => {
  const 입력중 = ['INPUT','TEXTAREA'].includes(document.activeElement.tagName);
  if (e.key === '/' && !입력중){
    e.preventDefault();
    $charInput.focus();
  }
});

// 첫 화면 그리기
사이트버튼그리기();
목록그리기();
$charInput.focus();
</script>
</body>
</html>
